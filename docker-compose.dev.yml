# Development compose - just database and ML service
# Rails runs locally for faster development
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#   rails server (in another terminal)

version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: now_now_rails_development
    ports:
      - "5432:5432"

  # Python ML Microservice
  ml_service:
    build:
      context: ./ml_service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1

volumes:
  postgres_dev_data:
